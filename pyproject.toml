[project]
name = "jailbreak-prompt-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "ftfy>=6.3.1",
    "ipywidgets>=8.1.9",
    "langdetect>=1.0.9",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jailbreak_detection"]
